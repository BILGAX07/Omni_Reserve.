
services:
  postgres:
    image: postgres:17
    container_name: omnireserve-postgres
    environment:
      POSTGRES_DB: OmniReserveDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - omnireserve_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: omnireserve-redis
    ports:
      - "6379:6379"

volumes:
  omnireserve_postgres_data:
